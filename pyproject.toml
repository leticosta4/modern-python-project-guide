[project]
name = "text-toolkit"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pytest-ranking>=0.3.4",
    "pytest-regsmart @ git+https://github.com/leticosta4/pytest-regsmart.git@main",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]
